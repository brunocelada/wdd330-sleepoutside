<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>
  <button id="checkout-button">↪ Back to Cart
  </button>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkout-form" class="divider" method="get">
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />
        </div>

        <div class="form-group">
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />
        </div>

        <div class="form-group">
          <label for="card_num">Credit Card Number</label>
          <input type="text" id="card_num" name="card_num" required />
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" required />
          <label for="cvv">Security Code</label>
          <input type="text" id="cvv" name="cvv" required />
        </div>

        <div class="form-group summary">
          <p>Subtotal: $<span id="subtotal">0</span></p>
          <p>Tax: $<span id="tax">0</span></p>
          <p>Shipping estimate: $<span id="shipping">0</span></p>
          <p>Order Total: $<span id="order-total">0</span></p>
        </div>

        <button type="submit">Place Order</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
