<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkout-form" class="divider" name="checkout">
        <input type="hidden" name="orderDate" id="orderDate">


        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />
        </div>
        <div class="form-group">
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />
        </div>
        <div class="form-group">
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" value="1234123412341234" required />
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" required value="12/99" placeholder="01/26"
            pattern="(0[1-9]|1[0-2])\/[0-9]{2}" />
          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" required value="123" />
        </div>
        <div class="form-group summary">
          <p>Subtotal: $<span id="subtotal">0</span></p>
          <p>Tax: $<span id="tax">0</span></p>
          <p>Shipping estimate: $<span id="shipping">0</span></p>
          <p>Order Total: $<span id="order-total">0</span></p>
        </div>

        <button type="submit" id="checkoutSubmit">Place Order</button>
      </form>
      <div class="list-footer hide">
        <button id="checkout-button">↪ Back to Cart</button>
      </div>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
