<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Listing</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/product-listing.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <div id="breadcrumb"></div>

    <main class="divider">
      <section class="products">
        <h2>Top Products: <span class="title highlight"></span></h2>
        <label for="sort-products">Sort by:</label>
        <select id="sort-products">
          <option value="name-asc">Name: A → Z</option>
          <option value="name-desc">Name: Z → A</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
        </select>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
